<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3b7d3b" />
  <title>Minecraft LE — Game</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game-page">
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="hud"><div id="crosshair"></div><div id="hotbar"></div></div>
    <div id="pause-menu" class="hidden">
      <h2>Game Paused</h2>
      <p class="hint">WASD · Mouse · Space / C · Shift</p>
      <button class="menu-btn" id="btn-resume">Resume</button>
      <button class="menu-btn" id="btn-exit">Save & Exit to Menu</button>
    </div>
    <div id="click-hint">Click to play</div>
  </div>
  <script type="module">
    import { Engine } from './js/engine/Engine.js';
    const canvas = document.getElementById('game-canvas');
    const engine = new Engine(canvas);
    engine.init();
    engine.start();
    const pauseMenu = document.getElementById('pause-menu');
    const clickHint = document.getElementById('click-hint');
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') {
        const paused = !pauseMenu.classList.contains('hidden');
        if (paused) {
          pauseMenu.classList.add('hidden');
          engine.start();
        } else {
          pauseMenu.classList.remove('hidden');
          engine.stop();
          if (document.pointerLockElement) document.exitPointerLock();
        }
      }
    });
    document.getElementById('btn-resume')?.addEventListener('click', () => {
      pauseMenu.classList.add('hidden');
      engine.start();
      canvas.requestPointerLock?.();
    });
    document.getElementById('btn-exit')?.addEventListener('click', () => {
      window.location.href = 'index.html';
    });
    document.addEventListener('pointerlockchange', () => {
      clickHint.style.display = document.pointerLockElement === canvas ? 'none' : 'block';
    });
    console.log('%cMinecraft LE — Engine Online', 'color:#3b7d3b;font-weight:bold');
  </script>
</body>
</html>
